version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/krillinai.lpk
  target_arch: amd64

# 上游镜像 ghcr.io/krillinai/krillinai 已私有化/下线（krillinai/KrillinAI 改名 OpenCreator），
# 无法配置镜像自动投递；改走 Git 版本源 + 保留 lazycat 既有镜像引用，发布链保持可用。
update:
  strategy: publish
  version_source:
    type: git

build:
  run_buildscript: false

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Krillin AI
    summary: "全能型音视频本地化与增强解决方案"
